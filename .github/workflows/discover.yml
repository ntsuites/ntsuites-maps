name: Connection test (OfficeRnD)

on:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Read data shape from OfficeRnD
        run: node scripts/discover.mjs
        env:
          OFFICERND_ORG: ${{ secrets.OFFICERND_ORG }}
          OFFICERND_CLIENT_ID: ${{ secrets.OFFICERND_CLIENT_ID }}
          OFFICERND_CLIENT_SECRET: ${{ secrets.OFFICERND_CLIENT_SECRET }}
